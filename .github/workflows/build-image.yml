name: Build SD Card Image (patched fork)

# Builds a bootable SeedSigner OS image from THIS repo's dev branch, instead
# of the official upstream source. Manual only (workflow_dispatch) -- this
# used to also fire automatically on every push to dev, which meant every
# small fix commit kicked off its own ~80-minute image build whether or not
# anyone was ready to flash and test it yet (2026-08-08, operator: "every
# time that we push to that dev branch it rebuilds the image automatically
# ... I have tried to make sure we do it one time and then it's like oh
# there's another thing"). These builds don't cost money on a public repo
# (GitHub Actions minutes are free for public repos -- confirmed via the
# Actions API's billable-minutes field reading 0 across every run of this
# workflow), but they do cost ~80 minutes of wall-clock wait each time, so
# batching several fixes into one deliberate build is worth doing regardless
# of the free minutes. Trigger a build only when you're actually ready for
# a new image: go to Actions -> "Build SD Card Image (patched fork)" -> "Run
# workflow", pick the board type, and run it once you're done stacking up
# fixes for this round.
on:
  workflow_dispatch:
    inputs:
      board_type:
        description: Target board
        type: choice
        default: pi0
        required: true
        options:
          - pi0
          - pi02w
          - pi2
          - pi4

permissions:
  contents: read

jobs:
  build-image:
    name: build image (${{ github.event.inputs.board_type || 'pi0' }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # GitHub-hosted ubuntu-latest runners only have ~14GB free by default;
      # the buildroot-based OS build needs 20-30GB. Clear space that this
      # job never touches before it runs.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          docker image prune -f
          df -h

      - name: checkout seedsigner-os
        env:
          # Pinned to a specific reviewed commit on seedsigner-os's main
          # branch, not a moving branch ref -- an unpinned `git clone` of
          # this repo (and its submodules, since --recursive resolves
          # them from whatever this commit's tree points them at) means
          # every build of THIS fork's dev branch also silently pulls in
          # whatever upstream OS/toolchain changes landed since the last
          # build, with no review step and no way to tell what actually
          # went into a given image. Update this SHA deliberately (and
          # note why in the commit message) when a newer seedsigner-os
          # commit is actually wanted.
          SEEDSIGNER_OS_COMMIT: d5a1077851a9b41d6637f7317e3f06aaa453bd5d
        run: |
          git clone --recursive https://github.com/SeedSigner/seedsigner-os.git seedsigner-os
          cd seedsigner-os
          git checkout "${SEEDSIGNER_OS_COMMIT}"
          git submodule update --init --recursive

      - name: build image
        working-directory: seedsigner-os
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
          BOARD_TYPE: ${{ github.event.inputs.board_type || 'pi0' }}
        run: |
          SS_ARGS="--${BOARD_TYPE} --app-repo=https://github.com/${{ github.repository }}.git --app-branch=dev" \
            docker compose up --force-recreate --build

      - name: list image
        run: ls -la seedsigner-os/images

      - name: checksum image
        # SeedSigner's own signed releases publish a checksum for exactly
        # this reason: flashing an unverifiable image bypasses that whole
        # chain. This workflow builds an image outside that chain (a
        # patched fork, not an official release), so publishing a
        # checksum alongside it is the minimum an operator needs to
        # confirm the .img artifact they download is byte-for-byte what
        # this specific build produced, before flashing real custody
        # hardware with it.
        working-directory: seedsigner-os/images
        run: sha256sum *.img | tee SHA256SUMS

      - name: upload image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, pinned by SHA not a mutable tag
        with:
          name: seedsigner-image
          path: |
            seedsigner-os/images/*.img
            seedsigner-os/images/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
